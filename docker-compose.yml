services:
  # ==========================================
  # Database: PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: finai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finai_password}
      POSTGRES_DB: ${POSTGRES_DB:-KRSI-FinAI}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finai_user} -d \"${POSTGRES_DB:-KRSI-FinAI}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finai_network

  # ==========================================
  # Cache & Broker: Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: finai_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finai_network

  # ==========================================
  # Backend API: FastAPI
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-finai_user}:${POSTGRES_PASSWORD:-finai_password}@postgres:5432/${POSTGRES_DB:-KRSI-FinAI}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finai_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  finai_network:
    driver: bridge

